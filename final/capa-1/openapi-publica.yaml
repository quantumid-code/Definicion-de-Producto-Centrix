openapi: 3.1.0

info:
  title: Centrix · Interfaz pública de procesamiento
  version: 0.1.0-borrador
  summary: Contrato transaccional de Centrix para clientes integradores.
  description: |
    Interfaz pública de Centrix. El consumidor es un **titular de afiliación** —adquirente,
    agregador o comercio con adquirencia propia— que procesa a través de Centrix.

    Este contrato deriva del modelo canónico de dominio (documento 0.2) y no contiene artefactos
    de mensajería de ninguna cámara ni procesador. Regla irrevocable 8.

    ## Principios del contrato

    - **Todo importe es entero en unidades mínimas y lleva moneda con exponente explícito.**
      Nunca decimal, nunca coma flotante. Documento 0.5.
    - **Toda operación que modifica estado exige `Idempotency-Key`.** Sin excepción.
    - **La intención y el intento son objetos distintos.** La intención expresa qué se quiere
      cobrar; el intento es una ejecución contra una ruta. Una intención puede tener varios.
    - **El estado indeterminado es visible para el cliente.** Cuando Centrix no sabe si el cobro
      ocurrió, lo dice. No se inventa un resultado.
    - **Autorización y captura son operaciones distintas** aunque ocurran en el mismo instante.
    - Los errores siguen el formato de detalles de problema, con tipo estable y legible por máquina.

    ## Estado

    Borrador de Capa 1. La taxonomía de resultados está definida en sus **clases**; los códigos
    específicos de cada cámara se resuelven en la tabla de mapeo y no aparecen aquí.
  contact:
    name: Centrix
  license:
    name: Interno confidencial

servers:
  - url: https://api.{tenant}.centrix.mx/v1
    description: Producción
    variables:
      tenant:
        default: cliente
        description: Identificador del cliente integrador
  - url: https://sandbox.api.{tenant}.centrix.mx/v1
    description: Ambiente de pruebas
    variables:
      tenant:
        default: cliente

security:
  - clientCredentials: []

tags:
  - name: Intenciones de cobro
    description: Ciclo transaccional
  - name: Comercios
    description: Sub-afiliaciones y sucursales
  - name: Terminales
  - name: Lotes
  - name: Liquidación
  - name: Conciliación

paths:

  /payment-intents:
    post:
      tags: [Intenciones de cobro]
      operationId: crearIntencion
      summary: Crea una intención de cobro
      description: |
        Crea la intención y, si el método lo permite, dispara el primer intento de forma síncrona.

        En flujo de **extracción** (tarjeta, vale) la respuesta trae el resultado de la
        autorización. Si el método exige captura del instrumento por pantalla hospedada —tarjeta en
        comercio electrónico— la respuesta trae `hosted_payment` y el estado queda en `en_proceso`. En flujo de **empuje** (transferencia, código QR) la respuesta trae la
        referencia de cobro y el estado `esperando_pago`; la confirmación llega por webhook.

        Si la respuesta es `202`, el resultado es **indeterminado**: Centrix no sabe si el cobro
        ocurrió. No reintentes con una clave de idempotencia distinta.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevaIntencion' }
      responses:
        '201':
          description: Intención creada y resuelta
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
            Centrix-Api-Version: { $ref: '#/components/headers/ApiVersion' }
            Deprecation: { $ref: '#/components/headers/Deprecation' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Intencion' }
        '202':
          description: |
            Resultado indeterminado. La operación fue enviada y no se recibió respuesta dentro de
            la ventana. Consulta la intención o espera el webhook. **No reintentes.**
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Intencion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '409': { $ref: '#/components/responses/ConflictoIdempotencia' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }
        'default': { $ref: '#/components/responses/Error' }

  /payment-intents/{intentId}:
    parameters:
      - $ref: '#/components/parameters/IntentId'
    get:
      tags: [Intenciones de cobro]
      operationId: obtenerIntencion
      summary: Consulta una intención de cobro
      responses:
        '200':
          description: Intención
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Intencion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        'default': { $ref: '#/components/responses/Error' }

  /payment-intents/{intentId}/attempts:
    parameters:
      - $ref: '#/components/parameters/IntentId'
    get:
      tags: [Intenciones de cobro]
      operationId: listarIntentos
      summary: Lista los intentos de una intención
      description: |
        Cada intento es una ejecución contra una ruta, con su propia decisión de ruteo y su propio
        resultado. Se exponen porque el cliente tiene derecho a saber por dónde salió su
        transacción y por qué.
      responses:
        '200':
          description: Intentos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Intento' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        'default': { $ref: '#/components/responses/Error' }

  /payment-intents/{intentId}/captures:
    parameters:
      - $ref: '#/components/parameters/IntentId'
    post:
      tags: [Intenciones de cobro]
      operationId: capturar
      summary: Captura una intención autorizada
      description: |
        Total o parcial. La suma de capturas nunca puede exceder el importe autorizado.
        Solo disponible en rieles con capacidad `captura_diferida`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevaCaptura' }
      responses:
        '201':
          description: Captura registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Captura' }
        '409': { $ref: '#/components/responses/ConflictoIdempotencia' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }
        'default': { $ref: '#/components/responses/Error' }

  /payment-intents/{intentId}/refunds:
    parameters:
      - $ref: '#/components/parameters/IntentId'
    post:
      tags: [Intenciones de cobro]
      operationId: devolver
      summary: Devuelve fondos tras la compensación
      description: |
        Total o parcial. Es una operación nueva con su propio ciclo, no la inversa de la original.
        Antes del cierre de lote usa `void` en vez de esta operación.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevaDevolucion' }
      responses:
        '201':
          description: Devolución registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Devolucion' }
        '409': { $ref: '#/components/responses/ConflictoIdempotencia' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }
        'default': { $ref: '#/components/responses/Error' }

  /payment-intents/{intentId}/void:
    parameters:
      - $ref: '#/components/parameters/IntentId'
    post:
      tags: [Intenciones de cobro]
      operationId: anular
      summary: Anula antes del cierre de lote
      description: |
        Elimina el cobro antes de que se compense. No devuelve fondos: los libera. Solo válido
        mientras el lote esté abierto.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Intención anulada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Intencion' }
        '409': { $ref: '#/components/responses/ConflictoIdempotencia' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }
        'default': { $ref: '#/components/responses/Error' }

  /merchants/{merchantId}/capabilities:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
    get:
      tags: [Comercios]
      operationId: consultarCapacidades
      summary: Capacidades operativas de un comercio, por marca
      description: |
        Qué operaciones admite realmente este comercio, resueltas por **riel, marca y programa**
        (decisión D47).

        Existe porque una capacidad del riel no implica la de la marca: hay combinaciones que no
        admiten cancelación, preventa ni devolución fuera de lote mientras otras por la misma cámara
        sí. **Sin este recurso el cliente lo descubriría con un `422` al intentar la operación**, que
        es tarde y sin explicación.
      responses:
        '200':
          description: Capacidades vigentes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Capacidad' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        'default': { $ref: '#/components/responses/Error' }

  /merchants:
    get:
      tags: [Comercios]
      operationId: listarComercios
      summary: Lista sub-afiliaciones
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Comercios
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Comercio' }
                  next_cursor: { type: [string, 'null'] }
        'default': { $ref: '#/components/responses/Error' }
    post:
      tags: [Comercios]
      operationId: crearComercio
      summary: Da de alta una sub-afiliación
      description: |
        El alta no es inmediata: se solicita al procesador y el comercio queda en `en_alta` hasta
        que el tercero confirma. Documento 0.2, decisión D44.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevoComercio' }
      responses:
        '202':
          description: Alta solicitada; el comercio queda en estado `en_alta`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comercio' }
        '409': { $ref: '#/components/responses/ConflictoIdempotencia' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }
        'default': { $ref: '#/components/responses/Error' }

  /merchants/{merchantId}:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
    get:
      tags: [Comercios]
      operationId: obtenerComercio
      summary: Consulta una sub-afiliación
      responses:
        '200':
          description: Comercio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comercio' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        'default': { $ref: '#/components/responses/Error' }

  /merchants/{merchantId}/status:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
    post:
      tags: [Comercios]
      operationId: cambiarEstadoComercio
      summary: Suspende, reactiva o cierra una sub-afiliación
      description: |
        La **suspensión es reversible** y es la herramienta del titular de afiliación ante sospecha
        de fraude. El **cierre es terminal** y pasa primero por `cierre_solicitado` hasta que el
        procesador confirma.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CambioDeEstado' }
      responses:
        '202':
          description: Cambio solicitado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comercio' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }
        'default': { $ref: '#/components/responses/Error' }

  /terminals:
    post:
      tags: [Terminales]
      operationId: crearTerminal
      summary: Da de alta una terminal
      description: |
        La terminal tiene identidad dual: identificador de Centrix e identificador asignado por la
        red. El segundo llega cuando el tercero confirma. Decisión D45.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevaTerminal' }
      responses:
        '202':
          description: Alta solicitada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Terminal' }
        'default': { $ref: '#/components/responses/Error' }

  /terminals/{terminalId}:
    parameters:
      - name: terminalId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Terminales]
      operationId: obtenerTerminal
      summary: Consulta una terminal
      responses:
        '200':
          description: Terminal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Terminal' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        'default': { $ref: '#/components/responses/Error' }

  /batches/{batchId}/close:
    parameters:
      - name: batchId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Lotes]
      operationId: cerrarLote
      summary: Cierra un lote
      description: |
        Define la frontera del día operativo. Sin cierre no hay compensación ni conciliación.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Cierre solicitado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lote' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }
        'default': { $ref: '#/components/responses/Error' }

  /settlements:
    get:
      tags: [Liquidación]
      operationId: listarLiquidaciones
      summary: Lista liquidaciones
      description: |
        Un importe es dispersable solo si sus asientos están confirmados y no existe partida de
        conciliación abierta asociada. El estado `bloqueada` explica por qué no se dispersó.
      parameters:
        - name: merchant_id
          in: query
          schema: { type: string }
        - name: period
          in: query
          description: Periodo contable en formato ISO
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Liquidaciones
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Liquidacion' }
                  next_cursor: { type: [string, 'null'] }
        'default': { $ref: '#/components/responses/Error' }

  /reconciliation/items:
    get:
      tags: [Conciliación]
      operationId: listarPartidas
      summary: Lista partidas de conciliación
      description: |
        Las partidas no resueltas bloquean la dispersión. Esta es la superficie de gestión de
        diferencias. Documento 0.8.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/EstadoPartida' }
        - name: merchant_id
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Partidas
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PartidaConciliacion' }
                  next_cursor: { type: [string, 'null'] }
        'default': { $ref: '#/components/responses/Error' }

webhooks:

  intencionActualizada:
    post:
      operationId: webhookIntencion
      summary: Cambio de estado de una intención
      description: |
        Se emite en toda transición de estado, incluida la resolución de un estado indeterminado y
        la confirmación de pago en flujo de empuje.

        Firmado. Entrega al menos una vez: **el receptor debe ser idempotente**. Documento 1.7.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventoWebhook' }
      responses:
        '200': { description: Recibido }

  comercioActualizado:
    post:
      operationId: webhookComercio
      summary: Cambio de estado de una sub-afiliación
      description: |
        Incluye los cierres por cascada de cancelación de afiliación, que el cliente no solicitó
        y debe conocer. Decisión D39.

        **Las suscripciones admiten alcance por comercio**, no solo por cliente: un titular con
        cientos de comercios necesita que cada uno reciba lo suyo.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventoWebhook' }
      responses:
        '200': { description: Recibido }

components:

  securitySchemes:
    clientCredentials:
      type: oauth2
      description: |
        Credencial de cliente con alcance declarado sobre el árbol de identidad. Documento 0.10.
      flows:
        clientCredentials:
          tokenUrl: https://auth.centrix.mx/oauth/token
          scopes:
            payments:write: Crear y modificar intenciones de cobro
            payments:read: Consultar intenciones y intentos
            merchants:write: Administrar sub-afiliaciones y terminales
            merchants:read: Consultar sub-afiliaciones y terminales
            settlements:read: Consultar liquidación y conciliación

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Clave única generada por el cliente. **Obligatoria en toda operación que modifica estado.**

        Reenviar la misma clave con el mismo cuerpo devuelve el resultado original con la cabecera
        `Idempotent-Replay: true`. Reenviarla con un cuerpo distinto devuelve `409`.

        La ventana de retención es de al menos 24 horas.
      schema:
        type: string
        minLength: 16
        maxLength: 128

    IntentId:
      name: intentId
      in: path
      required: true
      schema: { type: string }

    MerchantId:
      name: merchantId
      in: path
      required: true
      schema: { type: string }

    Cursor:
      name: cursor
      in: query
      description: Cursor de paginación devuelto en la página anterior
      schema: { type: string }

    Limite:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  headers:
    ApiVersion:
      description: |
        Versión menor vigente que atendió la petición. La versión mayor va en la ruta; la menor no,
        para que una mejora compatible no obligue al cliente a cambiar de dirección.

        Se registra por transacción junto con la versión de configuración: permite reproducir el
        comportamiento exacto meses después y saber contra qué versión estaba integrado un cliente
        cuando reporta un problema. Documento 1.8 §10.
      schema:
        type: string
        examples: ['2026-08-16']

    Deprecation:
      description: |
        Presente en toda respuesta de una versión depreciada, con la fecha de retiro. El mismo aviso
        aparece en el portal, porque nadie lee cabeceras hasta que algo falla. Documento 1.8 §13.
      schema: { type: string, format: date }

    IdempotentReplay:
      description: Presente y verdadera cuando la respuesta es la repetición de una operación previa
      schema: { type: boolean }

  schemas:

    Importe:
      type: object
      description: |
        **Entero en unidades mínimas más moneda con exponente explícito.** Nunca decimal, nunca
        coma flotante. El exponente es dato: no se asume 2. Documento 0.5, regla irrevocable 1.
      required: [value, currency]
      properties:
        value:
          type: integer
          format: int64
          description: Valor en unidades mínimas. Admite signo.
          examples: [17301]
        currency:
          type: object
          required: [code, exponent]
          properties:
            code:
              type: string
              minLength: 3
              maxLength: 3
              examples: ['MXN']
            exponent:
              type: integer
              minimum: 0
              maximum: 4
              examples: [2]

    Flujo:
      type: string
      description: Extracción o empuje. Documento 0.9.
      enum: [extraccion, empuje]

    EstadoIntencion:
      type: string
      description: |
        Estados comunes, de extracción y de empuje. Los de un flujo no son alcanzables en el otro.
      enum:
        - creada
        - en_proceso
        - autorizada
        - capturada
        - capturada_parcial
        - anulada
        - expirada
        - esperando_pago
        - pagada
        - pagada_diferente
        - caducada
        - rechazada
        - devuelta
        - devuelta_parcial
        - indeterminada

    EstadoIntento:
      type: string
      enum:
        - preparado
        - enviado
        - aprobado
        - declinado
        - indeterminado
        - reverso_solicitado
        - revertido
        - resuelto_tardio
        - abandonado

    ClaseResultado:
      type: string
      description: |
        Clase canónica del resultado. Estable e independiente de cualquier cámara.

        `rechazo_estructural` agrupa las causas donde **reintentar no sirve de nada**: afiliación
        cerrada o inválida, marca no habilitada, terminal no reconocida. Tiene tratamiento propio.
      enum:
        - aprobado
        - rechazo_del_emisor
        - rechazo_por_fondos
        - rechazo_por_instrumento
        - rechazo_por_riesgo
        - rechazo_estructural
        - error_tecnico
        - indeterminado

    Resultado:
      type: object
      required: [class]
      properties:
        class: { $ref: '#/components/schemas/ClaseResultado' }
        reason_code:
          type: string
          description: Causa canónica dentro de la clase. Catálogo en el documento 0.11.
        reason_description:
          type: string
        retryable:
          type: boolean
          description: Falsa siempre en la clase `rechazo_estructural`.
        network_reference:
          type: string
          description: Referencia de recuperación asignada por el adquirente o la cámara.
        authorization_code:
          type: string

    ResultadoAutenticacion:
      type: string
      description: |
        Resultado canónico de la autenticación. **De este dato depende el traslado de
        responsabilidad en un contracargo**, por eso se persiste y se expone siempre.

        La codificación por marca y su ubicación por cámara viven en la tabla de mapeo.
      enum: [no_aplica, autenticado, intento_registrado, no_autenticado, fallida]

    ModoDeCaptura:
      type: string
      description: Concepto de negocio, no campo de trama. Documento 0.1.
      enum: [chip, contactless, banda, tecleado, comercio_electronico, credencial_almacenada]

    PlanDePromocion:
      type: object
      description: |
        Concepto de negocio local sin equivalente internacional pleno, de primera clase en el
        canónico. Decisión D22.
      required: [installments, plan_type]
      properties:
        installments: { type: integer, minimum: 2, maximum: 48 }
        plan_type:
          type: string
          enum: [sin_intereses, con_intereses, diferido]
        deferred_months:
          type: integer
          minimum: 0
          description: Meses de diferimiento del primer pago. Cero cuando no aplica.

    ReferenciaDeInstrumento:
      type: object
      description: |
        Sustituto no sensible del instrumento de pago. **Centrix nunca recibe, almacena ni transmite
        el número de cuenta principal ni el código de seguridad.** Reglas irrevocables 2 y 3.
      required: [token]
      properties:
        token:
          type: string
          description: Referencia provista por el procesador o la red.
        last_four:
          type: string
          minLength: 4
          maxLength: 4
        brand:
          type: string
        nature:
          type: string
          enum: [credito, debito, prepago, desconocida]
        issuer:
          type: string

    PantallaHospedada:
      type: object
      description: |
        Pantalla de captura alojada por el procesador, para tarjeta en canal de comercio
        electrónico.

        **Es la pieza que sostiene el alcance de cumplimiento** (documento 3.2): el número de tarjeta
        va del navegador del tarjetahabiente al procesador **sin pasar por Centrix**. Consumir la
        interfaz de cobro con datos en claro metería a Centrix en el entorno de datos de tarjeta y
        anularía la reducción de alcance completa.

        Centrix devuelve la dirección; el cliente redirige al pagador. El resultado llega por webhook.
      required: [url, expires_at]
      properties:
        url:
          type: string
          format: uri
        expires_at: { type: string, format: date-time }

    ReferenciaDeCobro:
      type: object
      description: Exclusiva de flujo de empuje. Documento 0.9.
      required: [public_id, expires_at]
      properties:
        public_id:
          type: string
          description: Lo que ve el pagador.
        expires_at: { type: string, format: date-time }
        reusable:
          type: boolean
          default: false
        payload:
          type: string
          description: Contenido del código o instrucción de pago, cuando aplique.

    DecisionDeRuteo:
      type: object
      description: |
        Se expone en lectura porque el cliente tiene derecho a saber bajo qué afiliación y por qué
        ruta salió su transacción. Se persiste aunque Centrix no pueda ejecutarla.
      properties:
        affiliation_id: { type: string }
        intended_route: { type: string }
        binding:
          type: string
          description: |
            Una restricción no se degrada ante caída de ruta. Preferencia sí.
          enum: [preferencia, restriccion]
        rule_id: { type: string }

    NuevaIntencion:
      type: object
      required: [amount, merchant_id, method]
      properties:
        amount: { $ref: '#/components/schemas/Importe' }
        merchant_id:
          type: string
          description: Sub-afiliación bajo la que se procesa.
        terminal_id:
          type: string
          description: Requerido en modo de captura presencial.
        method:
          type: string
          examples: [tarjeta, vale, transferencia, codigo_qr]
        rail:
          type: string
          description: Si se omite, Centrix lo resuelve por reglas de ruteo.
        capture_mode: { $ref: '#/components/schemas/ModoDeCaptura' }
        instrument: { $ref: '#/components/schemas/ReferenciaDeInstrumento' }
        installment_plan: { $ref: '#/components/schemas/PlanDePromocion' }
        gratuity: { $ref: '#/components/schemas/Importe' }
        auto_capture:
          type: boolean
          default: true
          description: |
            Cuando es verdadera, la captura se emite inmediatamente tras la autorización. Aun así
            son **dos operaciones con dos asientos contables distintos**: no existe un tipo
            «venta».
        return_url:
          type: string
          format: uri
          description: |
            A dónde vuelve el pagador tras la pantalla hospedada. Requerido cuando el método es
            tarjeta en canal de comercio electrónico.
        client_reference:
          type: string
          description: Identificador propio del cliente. Viaja de vuelta sin interpretación.
        metadata:
          type: object
          additionalProperties: { type: string }

    Intencion:
      type: object
      required: [id, status, amount, merchant_id, created_at]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/EstadoIntencion' }
        flow: { $ref: '#/components/schemas/Flujo' }
        amount: { $ref: '#/components/schemas/Importe' }
        captured_amount: { $ref: '#/components/schemas/Importe' }
        refunded_amount: { $ref: '#/components/schemas/Importe' }
        paid_amount:
          allOf: [{ $ref: '#/components/schemas/Importe' }]
          description: |
            Flujo de empuje. Se persiste aunque difiera del solicitado; nunca se sobrescribe con el
            importe pedido.
        merchant_id: { type: string }
        terminal_id: { type: string }
        method: { type: string }
        rail: { type: string }
        capture_mode: { $ref: '#/components/schemas/ModoDeCaptura' }
        instrument: { $ref: '#/components/schemas/ReferenciaDeInstrumento' }
        installment_plan: { $ref: '#/components/schemas/PlanDePromocion' }
        authentication: { $ref: '#/components/schemas/ResultadoAutenticacion' }
        hosted_payment:
          allOf: [{ $ref: '#/components/schemas/PantallaHospedada' }]
          description: |
            Presente cuando el cobro requiere captura del instrumento por pantalla hospedada. El
            estado de la intención permanece en `en_proceso` hasta que el pagador completa o
            abandona.
        payment_reference: { $ref: '#/components/schemas/ReferenciaDeCobro' }
        latest_result: { $ref: '#/components/schemas/Resultado' }
        network_lifecycle_id:
          type: string
          description: |
            Identificador de seguimiento asignado por la marca o la cámara. Llega en la respuesta de
            aprobación y **debe reenviarse en devoluciones, reversos y cierre de operativas de dos
            pasos**. Distinto del número de rastreo, la referencia de recuperación y el código de
            autorización. Se imprime en el comprobante porque se usa para aclaraciones.
        trace_id:
          type: string
          description: Identificador único de trazabilidad punta a punta.
        client_reference: { type: string }
        batch_id: { type: string }
        config_version:
          type: string
          description: |
            Versión de configuración aplicada. Permite reproducir la decisión y el cálculo meses
            después. Decisión D21.
        metadata:
          type: object
          additionalProperties: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Intento:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/EstadoIntento' }
        routing_decision: { $ref: '#/components/schemas/DecisionDeRuteo' }
        result: { $ref: '#/components/schemas/Resultado' }
        sent_at: { type: string, format: date-time }
        resolved_at: { type: [string, 'null'], format: date-time }

    NuevaCaptura:
      type: object
      properties:
        amount:
          allOf: [{ $ref: '#/components/schemas/Importe' }]
          description: Si se omite, se captura el total autorizado.

    Captura:
      type: object
      required: [id, amount, created_at]
      properties:
        id: { type: string }
        amount: { $ref: '#/components/schemas/Importe' }
        result: { $ref: '#/components/schemas/Resultado' }
        created_at: { type: string, format: date-time }

    NuevaDevolucion:
      type: object
      properties:
        amount:
          allOf: [{ $ref: '#/components/schemas/Importe' }]
          description: Si se omite, se devuelve el total capturado.
        reason: { type: string }

    Devolucion:
      type: object
      required: [id, amount, created_at]
      properties:
        id: { type: string }
        amount: { $ref: '#/components/schemas/Importe' }
        result: { $ref: '#/components/schemas/Resultado' }
        reason: { type: string }
        created_at: { type: string, format: date-time }

    Capacidad:
      type: object
      required: [brand, operations]
      properties:
        brand: { type: string }
        program:
          type: string
          description: Programa de aceptación bajo el que opera la marca, cuando aplique.
        rail: { type: string }
        operations:
          type: object
          description: Operación soportada por esta combinación.
          additionalProperties: { type: boolean }
          examples:
            - autoriza: true
              captura_diferida: true
              anula: false
              devuelve: true
              devuelve_parcial: false
              disputa: true

    EstadoComercio:
      type: string
      enum: [en_alta, activa, suspendida, cierre_solicitado, cerrada]

    NuevoComercio:
      type: object
      required: [legal_name, tax_id, merchant_category, affiliation_id]
      properties:
        legal_name:
          type: string
          description: Razón social. La sub-afiliación se otorga a este nivel. Decisión D43.
        trade_name: { type: string }
        tax_id: { type: string }
        merchant_category:
          type: string
          description: |
            **Llave económica, no atributo descriptivo.** Determina tasa y puede determinar
            afiliación. Su validación es obligación del titular de afiliación.
        affiliation_id: { type: string }
        parent_merchant_id:
          type: string
          description: |
            Nodo superior en la jerarquía. La jerarquía admite profundidad variable; ningún
            consumidor debe asumir cuatro niveles.
        settlement_level:
          type: string
          description: Nivel al que se concilia y liquida este nodo.
          enum: [cabeza, propio]
          default: propio

    Comercio:
      type: object
      required: [id, status, legal_name]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/EstadoComercio' }
        observed_status:
          type: string
          description: |
            Lo que el comportamiento del tercero demuestra, frente al estado declarado. La
            divergencia es información, no error. Decisión D40.
          enum: [operando, rechazando_estructural, sin_respuesta, desconocido]
        legal_name: { type: string }
        trade_name: { type: string }
        tax_id: { type: string }
        merchant_category: { type: string }
        affiliation_id: { type: string }
        parent_merchant_id: { type: [string, 'null'] }
        settlement_level: { type: string, enum: [cabeza, propio] }
        status_reason:
          type: string
          description: Motivo del estado actual. Obligatorio en suspensión y cierre.
        created_at: { type: string, format: date-time }

    CambioDeEstado:
      type: object
      required: [action, reason]
      properties:
        action:
          type: string
          enum: [suspender, reactivar, cerrar]
        reason:
          type: string
          description: Obligatorio. Se propaga y se registra en la bitácora.

    NuevaTerminal:
      type: object
      required: [merchant_id, serial_number]
      properties:
        merchant_id: { type: string }
        branch_id:
          type: string
          description: |
            Nivel derivado. La cámara no lo conoce: la atribución a sucursal se deriva de la
            terminal.
        serial_number: { type: string }
        manufacturer: { type: string }
        model: { type: string }

    Terminal:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          description: Identificador interno de Centrix.
        network_id:
          type: [string, 'null']
          description: |
            Identificador asignado por la red. Nulo hasta que el tercero confirma el alta.
            Identidad dual, decisión D45.
        status:
          type: string
          enum: [registrada, alta_solicitada, activa, suspendida, baja]
        merchant_id: { type: string }
        branch_id: { type: [string, 'null'] }
        serial_number: { type: string }

    Lote:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [abierto, cierre_solicitado, cerrado, compensado]
        terminal_id: { type: string }
        opened_at: { type: string, format: date-time }
        closed_at: { type: [string, 'null'], format: date-time }
        totals:
          type: object
          properties:
            sales: { $ref: '#/components/schemas/Importe' }
            refunds: { $ref: '#/components/schemas/Importe' }
            count: { type: integer }

    Liquidacion:
      type: object
      required: [id, status, net_amount]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [calculada, bloqueada, instruida, confirmada, fallida]
        blocked_reason:
          type: string
          description: |
            Presente cuando el estado es `bloqueada`.

            **`revision_de_riesgo` y `disputa_abierta` retienen el pago sin detener la venta:** la
            transacción se autorizó, se cobró y el comprador recibió su compra. Lo que se excluye de
            la liquidación es el importe, para tenerlo disponible si llega un contracargo. Al
            resolverse a favor se acredita en la corrida siguiente sin intervención.
          enum:
            - partida_no_conciliada
            - transaccion_indeterminada
            - revision_de_riesgo
            - disputa_abierta
        merchant_id: { type: string }
        period: { type: string }
        gross_amount: { $ref: '#/components/schemas/Importe' }
        fees: { $ref: '#/components/schemas/Importe' }
        taxes: { $ref: '#/components/schemas/Importe' }
        net_amount: { $ref: '#/components/schemas/Importe' }

    EstadoPartida:
      type: string
      enum:
        - pendiente
        - casada
        - diferencia_importe
        - faltante_en_origen
        - faltante_en_destino
        - duplicada
        - ambigua
        - resuelta

    PartidaConciliacion:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/EstadoPartida' }
        source:
          type: string
          enum: [procesador, camara, banco, emisora]
        intent_id: { type: [string, 'null'] }
        merchant_id: { type: string }
        expected_amount: { $ref: '#/components/schemas/Importe' }
        reported_amount: { $ref: '#/components/schemas/Importe' }
        difference: { $ref: '#/components/schemas/Importe' }
        correlation_level:
          type: string
          description: Nivel de la llave jerárquica que produjo la coincidencia. Documento 0.8.
          enum: [exacta, fuerte, media, debil, sin_coincidencia]
        resolution_reason: { type: string }
        resolved_by: { type: string }
        resolved_at: { type: [string, 'null'], format: date-time }

    EventoWebhook:
      type: object
      required: [id, type, occurred_at, data]
      properties:
        id:
          type: string
          description: |
            Identificador único del evento. **El receptor debe deduplicar por este valor:** la
            entrega es al menos una vez.
        type:
          type: string
          examples: ['payment_intent.status_changed', 'merchant.status_changed']
        occurred_at: { type: string, format: date-time }
        sequence:
          type: integer
          description: Orden dentro del recurso. Un evento con secuencia menor a la última recibida se descarta.
        data:
          type: object
          description: El recurso completo en su estado posterior al evento.

    Problema:
      type: object
      description: Formato de detalles de problema.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: Identificador estable del tipo de error. Es lo que el cliente debe programar.
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        trace_id: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

  responses:

    SolicitudInvalida:
      description: Solicitud mal formada
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }

    ConflictoIdempotencia:
      description: |
        La clave de idempotencia ya se usó con un cuerpo distinto.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }

    ReglaDeNegocio:
      description: |
        La operación es válida sintácticamente y viola una regla del modelo: importe de captura
        superior al autorizado, operación no soportada por el riel, transición de estado no
        permitida, comercio suspendido.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }

    NoEncontrado:
      description: Recurso no encontrado en el alcance de la credencial
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }

    Error:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
